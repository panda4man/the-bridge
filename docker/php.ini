; Overrides on top of php.ini-production, applied last (zz- prefix).

; A deploy log is written in chunks and read back whole; the panel also renders
; a full deployment record. 256M is generous for both and still bounded.
memory_limit = 256M

; ParityController's env-write endpoint POSTs a whole .env file as a form
; field, and the panel's own forms are larger than PHP's 8M default once a
; long deploy_steps block is involved.
post_max_size = 32M
upload_max_filesize = 32M

; The web tier never runs a deploy — DeployApp is queued — so no request
; legitimately needs longer than this. The queue worker is CLI, where
; max_execution_time is already 0 and unaffected by this line.
max_execution_time = 120

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The application source is baked into the image and cannot change while it
; runs, so revalidation is pure overhead.
opcache.validate_timestamps = 0

expose_php = Off
