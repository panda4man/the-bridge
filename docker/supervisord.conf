; Three long-running processes: the web server and TWO queue workers.
;
; The two workers are not interchangeable and their separation is load-bearing.
; See app/Jobs/PollHealthChecks.php's class docblock for the full reasoning; the
; short version:
;
;   deploy-worker  --queue=default  concurrency MUST stay 1. config/queue.php's
;                  retry_after (90s) makes a reserved job visible again while it
;                  is still running; that is harmless only because the single
;                  worker holding it is the only one that could take it. A
;                  second worker on this queue turns every deploy longer than
;                  90 seconds into a duplicate deploy.
;
;   health-worker  --queue=health   exists so a 40-minute build cannot stall
;                  health polling — and therefore Slack down-alerts — for every
;                  other app for its whole duration.
;
; The `--queue` values are pinned against the job classes by
; tests/Feature/Packaging/PackagingConfigTest.php. A mismatch here does not
; error; it silently enqueues work nothing ever runs.
;
; No `environment=` on any program: DOCKER_BUILDKIT / DOCKER_CONFIG / HOME are
; set as image ENV and inherited, so a compose `environment:` override actually
; reaches the workers. A program-level environment= would shadow it.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; `docker exec bridge supervisorctl status` for triage.
[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:frankenphp]
command=frankenphp run --config /etc/frankenphp/Caddyfile
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:deploy-worker]
; --timeout=0 is redundant — DeployApp::$timeout wins over the flag via the job
; payload (Worker::timeoutForJob) — and is kept because it documents that a
; deploy is allowed to take as long as it takes.
; --tries=3 mirrors DeployApp::$tries, which also wins; only the two "not
; found" throws at the top of handle() can ever consume an attempt.
; --max-time recycles the process hourly between jobs, never mid-job.
command=php /app/artisan queue:work --queue=default --tries=3 --timeout=0 --sleep=1 --max-time=3600
directory=/app
autostart=true
autorestart=true
startsecs=3
; SIGTERM makes queue:work finish the current job and then exit, which is the
; whole point of replacing the Express worker's immediate process.exit(0).
; Giving it ten minutes means an ordinary restart does not abandon a build.
; Anything still running past that is killed and picked up by
; `bridge:reset-stuck-deployments` on the next boot. `docker compose down -t 0`
; skips the wait when you do not care.
stopsignal=TERM
stopwaitsecs=600
; Must stay false. queue:work's children ARE the deploy (`docker compose up
; --build`); signalling the whole process group would kill the build instead of
; letting it finish.
stopasgroup=false
killasgroup=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:health-worker]
; --tries=1 is REQUIRED, not tuning. PollHealthChecks re-dispatches itself from
; a `finally`, so a tick that throws has already scheduled its successor; a
; retry of that same job would fork the chain in two and double it again on
; every subsequent failure. One attempt, then failed_jobs, chain intact.
command=php /app/artisan queue:work --queue=health --tries=1 --sleep=5 --max-time=3600
directory=/app
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
