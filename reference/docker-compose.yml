services:
  bridge:
    container_name: bridge
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${BRIDGE_PORT:-8080}:3000"
    volumes:
      - ${REPOS_PATH}:${REPOS_PATH}
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
    environment:
      - PORT=3000
      - DB_PATH=/data/bridge.db
      - REPOS_PATH=${REPOS_PATH}
      - SESSION_SECRET=${SESSION_SECRET:-bridge-secret-change-me}
      - BRIDGE_SSH_KEY_PATH=${BRIDGE_SSH_KEY_PATH:-/data/ssh/id_rsa}
      - BRIDGE_API_TOKEN=${BRIDGE_API_TOKEN:-}
