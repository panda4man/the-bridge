[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:bridge]
command=/app/node_modules/.bin/tsx /app/src/server.ts
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=/app/node_modules/.bin/tsx /app/src/worker.ts
directory=/app
user=root
environment=HOME="/root",DOCKER_CONFIG="/root/.docker",DOCKER_BUILDKIT="0",DOCKER_API_VERSION="1.43"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
