[project]
name = "bridge-mcp"
version = "0.1.0"
description = "MCP server that calls The Bridge deployment API and teaches AI agents how to use it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2",
    "httpx>=0.27",
]

[project.scripts]
bridge-mcp = "bridge_mcp.server:main"
bridge-mcp-init = "bridge_mcp.init:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"bridge_mcp/AGENT_INSTRUCTIONS.md" = "bridge_mcp/AGENT_INSTRUCTIONS.md"
