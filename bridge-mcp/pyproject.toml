[project]
name = "bridge-mcp"
version = "0.1.0"
description = "Instruction-only MCP server that teaches AI agents how to call The Bridge deployment API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2",
]

[project.scripts]
bridge-mcp = "bridge_mcp.server:main"
bridge-mcp-init = "bridge_mcp.init:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"bridge_mcp/AGENT_INSTRUCTIONS.md" = "bridge_mcp/AGENT_INSTRUCTIONS.md"
